<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism — feature card</title>
<script src="mk.js"></script>
<link rel="stylesheet" href="mk.css">
<script src="../../design/assets/icons.js"></script>
<script src="../../design/assets/brand.js"></script>
<style>
  body, .stage { width: 1080px; height: 1080px; }
  .top { position: absolute; left: 80px; right: 80px; top: 76px; }
  .brandrow { font-size: 22px; gap: 12px; margin-bottom: 54px; }
  .brandrow .tile { width: 38px; height: 38px; border-radius: 11px; }
  .eyebrow { font-size: 21px; margin-bottom: 16px; }
  h1.display { font-size: 92px; }
  .lede { font-size: 25px; margin-top: 22px; max-width: 820px; }
  .vis { position: absolute; }
  .crop { border-radius: 14px; background-color: var(--surface-base); }
  .num { position: absolute; right: 80px; top: 80px; font: 600 20px/1 var(--font-mono); color: var(--text-tertiary); }
  .rays { opacity: .5; }
  /* resume visual */
  .resume { left: 80px; right: 80px; bottom: 90px; padding: 44px; border-radius: 28px; display: grid; gap: 28px; }
  .resume .row { display: flex; align-items: center; justify-content: space-between; font-size: 22px; color: var(--text-secondary); }
  .resume .big { font-size: 84px; font-weight: 650; letter-spacing: -0.04em; color: var(--text-primary); }
  .resume .segbar { height: 24px; border-radius: 8px; }
  .resume .ok { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; font-size: 21px; color: var(--success); background: rgb(var(--success-rgb) / .12); box-shadow: inset 0 0 0 1px rgb(var(--success-rgb) / .25); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .steps div { padding: 16px; border-radius: 14px; background: var(--control-bg); box-shadow: inset 0 0 0 1px var(--border-subtle); font-size: 18px; color: var(--text-secondary); line-height: 1.35; }
  .steps b { display: block; color: var(--text-primary); font-size: 19px; margin-bottom: 4px; }
  .split .half { position: absolute; inset: 0; border-radius: 14px; }
  .split .l { clip-path: polygon(0 0, 60% 0, 40% 100%, 0 100%); }
  .split .d { clip-path: polygon(60% 0, 100% 0, 100% 100%, 40% 100%); }
  .split svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgb(124 120 255 / .9)); }
  .chips { display: flex; gap: 12px; }
  .chips span { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 20px; border-radius: 14px; font-size: 20px; font-weight: 500; color: var(--text-secondary); background: var(--control-bg); box-shadow: inset 0 0 0 1px var(--border-default); }
</style>
</head>
<body>
<div class="stage">
  <div class="aurora"></div>
  <div class="grid-lines"></div>
  <div class="rays" id="rays"></div>
  <div class="top" id="top"></div>
  <div class="num" id="num"></div>
  <div id="vis"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var n = Number(q.get("card") || 1);
  var C = {
    1: { eyebrow: "Dynamic segmentation", title: '16 connections.<br><span class="prism-text">One file.</span>', lede: "Idle connections steal work from slow ones, so every lane finishes together.",
      vis: '<div class="vis shot shot--tight" style="left:110px;top:520px;width:860px"><img data-shot="details" alt=""></div>' },
    2: { eyebrow: "Video downloads", title: 'Any video.<br><span class="prism-text">Up to 8K HDR.</span>', lede: "Pick a quality — or just the audio — right from the page you are watching.",
      vis: '<div class="vis shot shot--tight" style="left:160px;top:500px;width:760px"><img data-shot="video" alt=""></div>' },
    3: { eyebrow: "Browser integration", title: 'Every click,<br><span class="prism-text">captured.</span>', lede: "Your browser hands its downloads to Prism — cookies included.",
      vis: '<div class="vis chips" style="left:80px;top:476px">' + ["Chrome", "Edge", "Brave", "Firefox"].map(function (b) { return "<span>{{icon:browser:20}} " + b + "</span>"; }).join("") + "</div>" +
           '<div class="vis shot shot--tight" style="left:180px;top:580px;width:820px"><img data-shot="capture" alt=""></div>' },
    4: { eyebrow: "Queues & scheduler", title: 'Set it. Sleep.<br><span class="prism-text">Done.</span>', lede: "Night queues on chosen days, a stop time — then sleep or shut down.",
      vis: '<div class="vis shot" style="left:120px;top:500px;width:1000px;height:640px;padding:10px"><div class="crop" data-crop="scheduler" data-region="282,100,876,700" style="width:100%;height:100%"></div></div>' },
    5: { eyebrow: "Crash-safe resume", title: 'Pull the plug.<br><span class="prism-text">Lose nothing.</span>', lede: "Progress is recorded only after it is safely on disk.",
      vis: '<div class="vis resume shot" style="position:absolute"><div class="row"><span class="big">63.9%</span><span class="ok">{{icon:shield:22}} Resumed after power loss</span></div><div class="segbar" id="segbar"></div>' +
           '<div class="steps"><div><b>Write</b>data lands at its final offset</div><div><b>Sync</b>fsync before the checkpoint</div><div><b>Resume</b>If-Range keeps it the same file</div></div></div>' },
    6: { eyebrow: "Light & dark", title: 'Your light.<br><span class="prism-text">Your dark.</span>', lede: "Two hand-tuned themes and six accents, following your system.",
      vis: '<div class="vis shot split" style="left:120px;top:500px;width:1000px;height:640px;padding:0">' +
           '<div class="half l crop" data-crop="main-plain" data-theme="light" data-region="0,0,1000,640"></div><div class="half d crop" data-crop="main-plain" data-theme="dark" data-region="0,0,1000,640"></div>' +
           '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="60" y1="0" x2="40" y2="100" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg></div>' },
  };
  var c = C[n];
  document.getElementById("top").innerHTML = '<div class="brandrow"><span class="tile" id="tile"></span>Prism</div><div class="eyebrow">' + c.eyebrow + '</div><h1 class="display">' + c.title + '</h1><p class="lede">' + c.lede + "</p>";
  document.getElementById("num").textContent = String(n).padStart(2, "0") + " / 06";
  document.getElementById("vis").innerHTML = c.vis;
  document.getElementById("rays").innerHTML = raysSvg({ w: 1500, h: 1100, x0: -60, y0: 820, spread: 420, len: 1500, width: 14, blur: 26, opacity: 0.6 });
  var seg = document.getElementById("segbar");
  if (seg) {
    var f = [1, 1, 1, 0.9, 0.7, 0.8, 0.6, 0.75, 0.55, 0.65, 0.5, 0.7, 0.45, 0.6, 0.4, 0.55], s = "";
    for (var i = 0; i < 16; i++) s += '<span class="segbar__seg" data-active="' + (f[i] < 1) + '" style="--a:' + i / 16 + ";--b:" + (i + 1) / 16 + ";--p:" + f[i] + ";--c:var(--spectrum-" + ((i % 8) + 1) + ')"></span>';
    seg.innerHTML = s;
  }
  fillIcons();
  document.getElementById("tile").innerHTML = logoMark(28);
</script>
</body>
</html>
