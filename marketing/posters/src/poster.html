<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism — A2 poster</title>
<script src="pk.js"></script>
<link rel="stylesheet" href="ps.css">
<script src="../../../design/assets/icons.js"></script>
<script src="../../../design/assets/brand.js"></script>
<script src="kv.js"></script>
<style>
  body, .stage { width: 1240px; height: 1754px; }
  .bar { position: absolute; left: 90px; right: 90px; top: 78px; display: flex; align-items: center; justify-content: space-between; }
  .word { font-size: 34px; gap: 16px; }
  .word .tile { width: 58px; height: 58px; border-radius: 17px; }
  .platforms { font-size: 22px; }
  .copy { position: absolute; left: 90px; right: 90px; }
  .eyebrow { font-size: 26px; margin-bottom: 26px; }
  .claim { font-size: 160px; }
  .sub { font-size: 32px; margin-top: 34px; max-width: 1000px; }
  .feats { gap: 18px 34px; margin-top: 44px; }
  .feat { gap: 12px; font-size: 24px; }
  .foot { position: absolute; left: 90px; right: 90px; bottom: 74px; display: flex; justify-content: space-between; align-items: flex-end; font-size: 18px; color: var(--text-tertiary); line-height: 1.5; }
  .foot b { color: var(--text-secondary); font-weight: 600; }
  .foot > div:first-child { max-width: 700px; }
  .foot > div:last-child { white-space: nowrap; }
  .rule { position: absolute; left: 90px; right: 90px; height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); }

  /* engine poster */
  .lanes2 { gap: 13px; }
  .lane2 { height: 18px; }
  .lanes-wrap { position: absolute; left: 90px; right: 90px; top: 180px; padding: 40px 48px 44px; border-radius: 34px; }
  .lanes-wrap .lh { display: flex; justify-content: space-between; font: 600 20px/1 var(--font-mono); color: var(--text-tertiary); margin-bottom: 26px; }
  .merge { position: absolute; right: 52px; top: 50%; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 54px; }
  .stat { padding: 30px 30px 28px; border-radius: 26px; }
  .stat b { font-size: 64px; }
  .stat span { display: block; font-size: 22px; margin-top: 8px; line-height: 1.35; }
  .shot.det { right: 64px; width: 600px; transform: rotate(-3deg); }

  /* video poster */
  .formats { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .fmt { position: relative; padding: 44px 44px 40px; border-radius: 34px; overflow: hidden; }
  .fmt .ic { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; color: #fff; margin-bottom: 34px; }
  .fmt h3 { font-size: 96px; letter-spacing: -0.045em; margin: 0; line-height: 1; }
  .fmt p { font-size: 25px; color: var(--text-secondary); margin: 14px 0 0; line-height: 1.4; }
  .fmt ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; }
  .fmt li { display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 20px; border-radius: 14px; font-size: 22px; background: var(--control-bg); box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--text-secondary); }
  .fmt li.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent-border); color: var(--text-primary); }
  .fmt li em { font-style: normal; color: var(--text-tertiary); font-size: 19px; }
  .fmt li b { font-weight: 600; }
  .glasspanel {
    background: linear-gradient(180deg, rgb(255 255 255 / .09), rgb(255 255 255 / .03));
    -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), inset 0 0 0 1px rgb(255 255 255 / .09), 0 40px 80px -30px rgb(0 0 0 / .7);
  }
  [data-theme="light"] .glasspanel { background: linear-gradient(180deg, rgb(255 255 255 / .82), rgb(255 255 255 / .6)); box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgb(255 255 255 / .9), 0 40px 80px -30px rgb(40 40 100 / .3); }
  .vstrip { position: absolute; left: 90px; right: 90px; top: 190px; height: 300px; border-radius: 26px; overflow: hidden; }
  .vstrip .crop { position: absolute; inset: 10px; border-radius: 18px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="night"></div>
  <div class="grid-lines"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var key = q.get("p") || "beam";
  var theme = document.documentElement.dataset.theme;
  var light = theme === "light";
  var stage = document.getElementById("stage");
  var kvSrc = q.get("kv"); // optional raster key visual (e.g. Blender still)

  var bar = '<div class="bar"><span class="word"><span class="tile" id="tile"></span>Prism</span><span class="platforms">Windows · Linux · macOS</span></div>';
  var foot = function (note) {
    return '<div class="foot"><div><b>Prism</b> — the multi-connection download manager<br>' + note + '</div><div style="text-align:right">Browser extension for Chromium & Firefox<br>Rust engine · Tauri app</div></div>';
  };
  var feats = function (list) {
    return '<div class="feats">' + list.map(function (f) { return '<span class="feat">{{icon:' + f[0] + ':30:1.9}}' + f[1] + "</span>"; }).join("") + "</div>";
  };

  var html = "";
  if (key === "beam") {
    html +=
      '<div class="kv" style="left:0;right:0;top:130px;height:910px">' +
      (kvSrc ? '<img src="' + kvSrc + '" style="width:100%;height:100%;object-fit:cover">' : keyVisual({ theme: theme, aspect: "xMidYMid slice" })) + "</div>" +
      bar +
      '<div class="copy" style="top:1030px"><h1 class="claim display">One beam.<br><span class="prism-text">Many rays.</span></h1>' +
      '<p class="sub">Prism splits every download into up to 32 parallel connections — and keeps every one of them busy until the very last byte.</p>' +
      feats([["activity", "Up to 32 connections"], ["shield", "Crash-safe resume"], ["browser", "Browser & video capture"]]) +
      "</div>" + foot("Resumes after crashes, reboots and dropped connections.");
  } else if (key === "engine") {
    var cols = ["#8b7bff", "#6a8cff", "#46a8ff", "#2fcbe6", "#2ed3a9", "#7ad66a", "#f2c14e", "#ff7f8f"];
    var fills = [0.92, 0.78, 0.86, 0.7, 0.95, 0.66, 0.82, 0.74, 0.9, 0.62, 0.8, 0.88, 0.69, 0.84, 0.76, 0.93];
    var lanes = fills.map(function (v, i) { return '<div class="lane2" style="--c:' + cols[i % 8] + '"><i style="width:' + v * 100 + '%"></i></div>'; }).join("");
    html +=
      bar +
      '<div class="lanes-wrap glasspanel"><div class="lh"><span>16 CONNECTIONS</span><span>ONE FILE · 6.2 GB</span></div><div class="lanes2">' + lanes + "</div></div>" +
      '<div class="copy" style="top:850px"><div class="eyebrow">The Prism engine</div><h1 class="claim display" style="font-size:136px">16 connections.<br><span class="prism-text">One file.</span></h1>' +
      '<p class="sub">Idle connections steal work from slow ones, so the whole file finishes together. Data goes straight to its final place on disk — no merging step.</p>' +
      '<div class="stats"><div class="stat glasspanel"><b class="tnum">966 <small style="font-size:30px;font-weight:600">MiB/s</small></b><span>raw throughput, measured¹</span></div>' +
      '<div class="stat glasspanel"><b>≈15×</b><span>faster than one connection on throttling servers²</span></div>' +
      '<div class="stat glasspanel"><b>✓</b><span>crash-safe resume, SHA-256 verified</span></div></div>' +
      "</div>" + foot("¹ 2 GiB, localhost, 8 connections. ² 1 GiB at 4 MiB/s per connection, 16 vs. 1 connection.");
  } else {
    html +=
      bar +
      '<div class="vstrip glasspanel"><div class="crop" data-crop="video" data-region="0,30,680,183"></div></div>' +
      '<div class="copy" style="top:540px"><div class="formats">' +
      '<div class="fmt glasspanel"><div class="ic" style="background:linear-gradient(160deg,#8b7bff,#5653ea)">{{icon:video:44:1.8}}</div><h3>MP4</h3><p>Video at the quality you pick.</p>' +
      '<ul><li><span><b>2160p60</b> HDR</span><em>~1.9 GB</em></li><li class="on"><span><b>1080p60</b></span><em>~412 MB</em></li><li><span><b>720p60</b></span><em>~198 MB</em></li></ul></div>' +
      '<div class="fmt glasspanel"><div class="ic" style="background:linear-gradient(160deg,#ff8aa5,#e0446e)">{{icon:music-note:44:1.8}}</div><h3>MP3</h3><p>Just the audio, ready for any player.</p>' +
      '<ul><li class="on"><span><b>320 kbps</b></span><em>~25 MB</em></li><li><span>Cover art</span><em>embedded</em></li><li><span>Title & artist</span><em>tagged</em></li></ul></div>' +
      "</div>" +
      '<h1 class="claim display" style="margin-top:64px;font-size:150px">Any video.<br><span class="prism-text">MP4 or MP3.</span></h1>' +
      '<p class="sub">Click “Download video” on the page, pick a format — done.</p>' +
      feats([["browser", "One click from the browser"], ["bolt", "Multi-connection speed"]]) +
      "</div>" + foot("Works with sites supported by yt-dlp. Download only what you have the rights to.");
  }
  stage.insertAdjacentHTML("beforeend", html);
  fillIcons();
  document.getElementById("tile").innerHTML = logoMark(46);
</script>
</body>
</html>
