<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism — banner</title>
<script src="pk.js"></script>
<link rel="stylesheet" href="ps.css">
<script src="../../../design/assets/icons.js"></script>
<script src="../../../design/assets/brand.js"></script>
<script src="kv.js"></script>
<style>
  .abs { position: absolute; }
  .glasspanel {
    background: linear-gradient(180deg, rgb(255 255 255 / .09), rgb(255 255 255 / .03));
    -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), inset 0 0 0 1px rgb(255 255 255 / .09), 0 40px 80px -30px rgb(0 0 0 / .7);
  }
  [data-theme="light"] .glasspanel { background: linear-gradient(180deg, rgb(255 255 255 / .82), rgb(255 255 255 / .6)); box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgb(255 255 255 / .9), 0 40px 80px -30px rgb(40 40 100 / .3); }
  .scrimL { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(4 5 10 / .92) 0%, rgb(4 5 10 / .6) 38%, transparent 62%); }
  [data-theme="light"] .scrimL { background: linear-gradient(90deg, rgb(246 247 252 / .95) 0%, rgb(246 247 252 / .65) 38%, transparent 62%); }
  .scrimB { position: absolute; inset: 0; background: linear-gradient(0deg, rgb(4 5 10 / .95) 0%, rgb(4 5 10 / .55) 40%, transparent 65%); }
  [data-theme="light"] .scrimB { background: linear-gradient(0deg, rgb(246 247 252 / .97) 0%, rgb(246 247 252 / .6) 40%, transparent 65%); }
  .tilebox { display: grid; place-items: center; background: linear-gradient(160deg, #2a2b3a, #0b0c12); box-shadow: inset 0 1px 0 rgb(255 255 255 / .2), inset 0 0 0 1px rgb(255 255 255 / .06), 0 10px 30px rgb(0 0 0 / .45); }
  .chipx { display: inline-flex; align-items: center; gap: .5em; padding: .45em .9em; border-radius: 999px; color: var(--text-secondary); font-weight: 500;
    background: rgb(255 255 255 / .07); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12); }
  [data-theme="light"] .chipx { background: rgb(255 255 255 / .7); box-shadow: inset 0 0 0 1px rgb(16 20 40 / .08); }
  .chipx .icon { color: var(--accent); }
  .lanes2 { gap: 10px; }
  .lane2 { height: 14px; }
  .fmtcard { border-radius: 28px; padding: 34px; display: grid; gap: 10px; }
  .fmtcard h3 { margin: 0; font-weight: 680; letter-spacing: -0.045em; line-height: 1; }
  .fmtcard p { margin: 0; color: var(--text-secondary); }
  .fmtcard .ic { display: grid; place-items: center; color: #fff; border-radius: 22%; }
  .split { overflow: hidden; }
  .split .half { position: absolute; inset: 0; background-repeat: no-repeat; }
  .split .l { clip-path: polygon(0 0, 58% 0, 42% 100%, 0 100%); }
  .split .d { clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); }
  .split svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgb(124 120 255 / .9)); }
  .safe { position: absolute; outline: 2px dashed rgb(255 0 120 / .8); pointer-events: none; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="night"></div><div class="grid-lines"></div></div>
<script>
  var q = new URLSearchParams(location.search);
  var fmt = q.get("f") || "billboard";
  var theme = document.documentElement.dataset.theme;
  var kvSrc = q.get("kv");
  var stage = document.getElementById("stage");
  var KV = function (style, opts) {
    return '<div class="kv" style="' + style + '">' + (kvSrc ? '<img src="' + kvSrc + '" style="width:100%;height:100%;object-fit:cover">' : keyVisual(Object.assign({ theme: theme }, opts || {}))) + "</div>";
  };
  var tile = function (px) { return '<span class="tilebox" style="width:' + px + "px;height:" + px + "px;border-radius:" + px * 0.29 + 'px" data-logo="' + Math.round(px * 0.78) + '"></span>'; };
  var word = function (px) { return '<span class="word" style="font-size:' + px + "px;gap:" + px * 0.45 + 'px">' + tile(px * 1.6) + "Prism</span>"; };
  var claim = function (px, a, b, extra) { return '<h1 class="claim display" style="font-size:' + px + "px;" + (extra || "") + '">' + a + (b ? '<br><span class="prism-text">' + b + "</span>" : "") + "</h1>"; };
  var sub = function (px, t, extra) { return '<p class="sub" style="font-size:' + px + "px;" + (extra || "") + '">' + t + "</p>"; };
  var chips = function (px, list, extra) { return '<div class="feats" style="gap:' + px * 0.6 + "px;font-size:" + px + "px;" + (extra || "") + '">' + list.map(function (c) { return '<span class="chipx">{{icon:' + c[0] + ":" + Math.round(px * 1.15) + ':1.9}}' + c[1] + "</span>"; }).join("") + "</div>"; };
  var shot = function (name, style, th) { return '<div class="shot abs" style="' + style + '"><img data-shot="' + name + '"' + (th ? ' data-theme="' + th + '"' : "") + ' alt=""></div>'; };
  var lanes = function (n, style) {
    var cols = ["#8b7bff", "#6a8cff", "#46a8ff", "#2fcbe6", "#2ed3a9", "#7ad66a", "#f2c14e", "#ff7f8f"];
    var f = [0.92, 0.78, 0.86, 0.7, 0.95, 0.66, 0.82, 0.74, 0.9, 0.62, 0.8, 0.88, 0.69, 0.84, 0.76, 0.93];
    var out = '<div class="abs glasspanel" style="' + style + '"><div class="lanes2">';
    for (var i = 0; i < n; i++) out += '<div class="lane2" style="--c:' + cols[i % 8] + '"><i style="width:' + f[i] * 100 + '%"></i></div>';
    return out + "</div></div>";
  };
  var platforms = function (px, style) { return '<div class="abs platforms" style="font-size:' + px + "px;" + style + '">Windows · Linux · macOS</div>'; };

  var F = {
    // 6000×2000 (1500×500 @4)
    billboard: { w: 1500, h: 500, html:
      KV("left:440px;right:-80px;top:-60px;bottom:-60px", { beamStart: 260 }) + '<div class="scrimL" style="right:50%"></div>' +
      '<div class="abs" style="left:70px;top:58px">' + word(22) + "</div>" +
      '<div class="abs" style="left:70px;top:150px">' + claim(108, "One beam.", "Many rays.") + "</div>" +
      platforms(17, "left:72px;bottom:44px") +
      '<div class="abs" style="right:60px;bottom:40px;text-align:right">' + sub(19, "Up to 32 connections per file · crash-safe resume") + "</div>" },
    // 3840×1600 (1920×800 @2)
    webhero: { w: 1920, h: 800, html:
      KV("left:620px;right:-140px;top:-40px;bottom:-40px", { beamStart: 300 }) +
      shot("main", "left:1290px;top:500px;width:600px;padding:6px;border-radius:14px") +
      '<div class="abs" style="left:120px;top:96px">' + word(22) + "</div>" +
      '<div class="abs" style="left:120px;top:200px;width:720px">' + claim(124, "One beam.", "Many rays.") +
      sub(26, "The download manager that splits every file into up to 32 parallel connections and keeps each one busy to the very last byte.", "margin-top:30px") +
      chips(18, [["activity", "966 MiB/s measured"], ["shield", "Crash-safe resume"], ["video", "MP4 & MP3 video"]], "margin-top:36px") + "</div>" +
      platforms(17, "left:122px;bottom:56px") },
    // 2560×1440 (1280×720 @2) — safe area 1546×423 centred
    youtube: { w: 1280, h: 720, html:
      KV("left:790px;right:-230px;top:120px;bottom:120px", { beamStart: 420 }) +
      '<div class="abs" style="left:253px;top:254px;width:773px;height:212px;display:flex;align-items:center;gap:30px">' + tile(96) +
      '<div>' + claim(58, 'One beam. <span class="prism-text">Many rays.</span>') + sub(18, "The multi-connection download manager · Windows · Linux · macOS", "margin-top:14px") + "</div></div>" },
    // 1500×500
    x: { w: 1500, h: 500, html:
      KV("left:640px;right:-60px;top:-40px;bottom:-40px", { beamStart: 380 }) + '<div class="scrimL" style="right:45%"></div>' +
      '<div class="abs" style="left:270px;top:110px">' + claim(92, "One beam.", "Many rays.") + sub(19, "Up to 32 connections · Windows · Linux · macOS", "margin-top:22px") + "</div>" },
    // 1584×396
    linkedin: { w: 1584, h: 396, html:
      KV("left:860px;right:-60px;top:-40px;bottom:-40px", { beamStart: 400 }) + '<div class="scrimL" style="right:40%"></div>' +
      '<div class="abs" style="left:420px;top:92px">' + claim(76, "One beam.", "Many rays.") + sub(17, "The multi-connection download manager", "margin-top:18px") + "</div>" },
    // 1080×1350
    ig1: { w: 1080, h: 1350, html:
      KV("left:-200px;right:-200px;top:120px;height:760px") +
      '<div class="abs" style="left:80px;top:70px">' + word(24) + "</div>" +
      '<div class="abs" style="left:80px;top:860px;right:80px">' + claim(132, "One beam.", "Many rays.") + sub(28, "Up to 32 parallel connections per download — each one busy to the last byte.", "margin-top:26px") + "</div>" },
    ig2: { w: 1080, h: 1350, html:
      lanes(16, "left:80px;right:80px;top:190px;padding:40px 44px;border-radius:30px") +
      '<div class="abs" style="left:80px;top:70px">' + word(24) + "</div>" +
      '<div class="abs" style="left:80px;top:690px;right:80px">' + claim(112, "16 connections.", "One file.") +
      '<div style="display:flex;gap:22px;margin-top:40px"><div class="glasspanel" style="flex:1;border-radius:24px;padding:26px 28px"><div style="font-size:58px;font-weight:680;letter-spacing:-.04em">966 <span style="font-size:26px">MiB/s</span></div><div class="text-tertiary" style="font-size:19px;margin-top:6px">raw throughput, measured¹</div></div>' +
      '<div class="glasspanel" style="flex:1;border-radius:24px;padding:26px 28px"><div style="font-size:58px;font-weight:680;letter-spacing:-.04em">≈15×</div><div class="text-tertiary" style="font-size:19px;margin-top:6px">faster on per-connection-throttled servers²</div></div></div>' +
      '<p class="text-tertiary" style="font-size:15px;margin-top:22px">¹ 2 GiB on localhost, 8 connections. ² 1 GiB at 4 MiB/s per connection, 16 connections vs. 1.</p></div>' },
    ig3: { w: 1080, h: 1350, html:
      '<div class="abs" style="left:80px;top:70px">' + word(24) + "</div>" +
      '<div class="abs" style="left:80px;right:80px;top:200px;display:grid;grid-template-columns:1fr 1fr;gap:24px">' +
      '<div class="fmtcard glasspanel"><span class="ic" style="width:76px;height:76px;background:linear-gradient(160deg,#8b7bff,#5653ea)">{{icon:video:40:1.8}}</span><h3 style="font-size:104px;margin-top:22px">MP4</h3><p style="font-size:24px">Video at the quality you pick</p></div>' +
      '<div class="fmtcard glasspanel"><span class="ic" style="width:76px;height:76px;background:linear-gradient(160deg,#ff8aa5,#e0446e)">{{icon:music-note:40:1.8}}</span><h3 style="font-size:104px;margin-top:22px">MP3</h3><p style="font-size:24px">Just the audio, 320 kbps</p></div></div>' +
      '<div class="abs glasspanel" style="left:80px;right:80px;top:640px;height:270px;border-radius:24px;padding:10px"><div data-crop="video" data-region="0,30,680,183" style="width:100%;height:100%;border-radius:16px"></div></div>' +
      '<div class="abs" style="left:80px;right:80px;bottom:90px">' + claim(120, "Any video.", "MP4 or MP3.") + sub(26, "Click “Download video” on the page, pick a format — done.", "margin-top:24px") + "</div>" },
    // 1080×1920
    story1: { w: 1080, h: 1920, html:
      KV("left:-300px;right:-340px;top:250px;height:1000px") +
      '<div class="abs" style="left:0;right:0;top:150px;display:flex;justify-content:center">' + word(30) + "</div>" +
      '<div class="abs" style="left:90px;right:90px;top:1240px;text-align:center">' + claim(148, "One beam.", "Many rays.") + sub(32, "The multi-connection download manager.", "margin-top:34px") +
      chips(24, [["activity", "32 connections"], ["shield", "Crash-safe"]], "justify-content:center;margin-top:44px") + "</div>" +
      platforms(24, "left:0;right:0;bottom:110px;text-align:center") },
    story2: { w: 1080, h: 1920, html:
      '<div class="abs" style="left:0;right:0;top:150px;display:flex;justify-content:center">' + word(30) + "</div>" +
      '<div class="abs" style="left:90px;right:90px;top:300px;text-align:center">' + claim(132, "16 connections.", "One file.") + sub(30, "Watch every connection race to the finish.", "margin-top:30px") + "</div>" +
      shot("details", "left:60px;top:760px;width:960px;padding:8px;border-radius:18px;transform:rotate(-3deg)") +
      shot("mini", "left:480px;top:1480px;width:520px;padding:6px;border-radius:14px") },
    // 1270×760
    ph1: { w: 1270, h: 760, html:
      KV("left:330px;right:-260px;top:-40px;bottom:-40px", { beamStart: 420 }) +
      '<div class="abs" style="left:64px;top:60px">' + word(20) + "</div>" +
      '<div class="abs" style="left:64px;top:240px;width:440px">' + claim(76, "One beam.", "Many rays.") + sub(19, "Up to 32 parallel connections per file, browser capture and video — in one calm, fast app.", "margin-top:20px") + "</div>" +
      platforms(15, "left:66px;bottom:46px") },
    ph2: { w: 1270, h: 760, html:
      shot("details", "left:560px;top:80px;width:680px;padding:6px;border-radius:14px") +
      '<div class="abs" style="left:64px;top:60px">' + word(20) + "</div>" +
      '<div class="abs" style="left:64px;top:210px;width:460px">' + claim(66, "16 connections.", "One file.") + sub(19, "Idle connections steal work from slow ones, so the whole file finishes together.", "margin-top:20px") +
      chips(15, [["activity", "966 MiB/s measured"], ["shield", "Crash-safe resume"]], "margin-top:28px") + "</div>" },
    ph3: { w: 1270, h: 760, html:
      '<div class="abs glasspanel" style="left:620px;right:60px;top:90px;height:200px;border-radius:20px;padding:8px"><div data-crop="video" data-region="0,30,680,183" style="width:100%;height:100%;border-radius:14px"></div></div>' +
      '<div class="abs" style="left:620px;right:60px;top:320px;display:grid;grid-template-columns:1fr 1fr;gap:18px">' +
      '<div class="fmtcard glasspanel" style="padding:26px"><span class="ic" style="width:58px;height:58px;background:linear-gradient(160deg,#8b7bff,#5653ea)">{{icon:video:30:1.8}}</span><h3 style="font-size:76px;margin-top:14px">MP4</h3><p style="font-size:17px">Video at the quality you pick</p></div>' +
      '<div class="fmtcard glasspanel" style="padding:26px"><span class="ic" style="width:58px;height:58px;background:linear-gradient(160deg,#ff8aa5,#e0446e)">{{icon:music-note:30:1.8}}</span><h3 style="font-size:76px;margin-top:14px">MP3</h3><p style="font-size:17px">Just the audio, 320 kbps</p></div></div>' +
      '<div class="abs" style="left:64px;top:60px">' + word(20) + "</div>" +
      '<div class="abs" style="left:64px;top:220px;width:500px">' + claim(72, "Any video.", "MP4 or MP3.") + sub(19, "One click on the page you are watching: pick the MP4 quality or take just the MP3 audio.", "margin-top:20px") +
      chips(15, [["browser", "From the browser"], ["bolt", "Multi-connection"]], "margin-top:28px") + "</div>" },
    ph4: { w: 1270, h: 760, html:
      '<div class="abs shot split" style="left:520px;top:100px;width:840px;height:560px;padding:0;border-radius:14px">' +
      '<div class="half l" data-crop="main" data-theme="light" data-region="0,0,900,600"></div><div class="half d" data-crop="main" data-theme="dark" data-region="0,0,900,600"></div>' +
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="58" y1="0" x2="42" y2="100" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg></div>' +
      '<div class="abs" style="left:64px;top:60px">' + word(20) + "</div>" +
      '<div class="abs" style="left:64px;top:230px;width:420px">' + claim(70, "Your light.", "Your dark.") + sub(19, "Two hand-tuned themes, six accent colours and liquid glass — following your system.", "margin-top:20px") + "</div>" },
  };
  var c = F[fmt];
  document.body.style.width = stage.style.width = c.w + "px";
  document.body.style.height = stage.style.height = c.h + "px";
  stage.insertAdjacentHTML("beforeend", c.html);
  if (q.has("safe") && fmt === "youtube") stage.insertAdjacentHTML("beforeend", '<div class="safe" style="left:253px;top:254px;width:773px;height:212px"></div>');
  fillIcons();
  document.querySelectorAll("[data-logo]").forEach(function (el) { el.innerHTML = logoMark(Number(el.dataset.logo)); });
</script>
</body>
</html>
