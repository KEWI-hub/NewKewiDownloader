<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 380px; margin: 0; padding: 12px;
    font: 13px/1.45 "Segoe UI", "Leelawadee UI", system-ui, sans-serif;
    color: #1b1f24; background: #f7f8fa;
  }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; }
  h1 img { width: 22px; height: 22px; border-radius: 50%; }
  h2 {
    margin: 14px 0 4px; font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; color: #6b7480;
  }

  .state { padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; }
  .state.ok   { background: #e6f6ec; color: #0b6a33; }
  .state.warn { background: #fff4e0; color: #7a4b00; }
  .state.bad  { background: #fdecec; color: #a1231f; }

  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 6px;
    padding: 6px 12px; background: #2997ff; color: #fff;
  }
  button:hover { background: #1b86ea; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #fff; color: #1b1f24; border: 1px solid #e2e5ea; }
  button.small { padding: 3px 8px; font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-top: 1px solid #e2e5ea;
  }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .tag { font-size: 11px; color: #6b7480; flex: none; }
  .ext { color: #1a7f4b; }

  .bar { width: 100%; height: 5px; border-radius: 3px; background: #e2e5ea; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #1a7f4b; }
  li.job { display: block; }
  li.job .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  li.job .why { font-size: 11px; color: #a1231f; margin-top: 3px; }

  pre#log {
    max-height: 150px; overflow: auto; margin: 0;
    font: 11px/1.4 Consolas, monospace; white-space: pre-wrap;
    background: #fff; border: 1px solid #e2e5ea; border-radius: 6px; padding: 7px;
  }
  .empty { color: #6b7480; font-size: 12px; padding: 8px 0; }
  .foot { margin-top: 12px; font-size: 11px; color: #6b7480; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> New Kewi Downloader</h1>

  <div id="state" class="state warn">กำลังดู…</div>

  <h2>วิดีโอในแท็บนี้</h2>
  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>ยังไม่เจอวิดีโอในแท็บนี้ — ลองกดเล่นวิดีโอก่อน แล้วเปิดเมนูนี้ใหม่</div>
  <div class="row" style="margin-top:8px">
    <button id="page" class="ghost small">โหลดทั้งหน้าลงโฟลเดอร์</button>
  </div>

  <h2>งานที่โหลดอยู่</h2>
  <ul id="jobs"></ul>
  <div id="nojobs" class="empty" hidden>ยังไม่มีงาน</div>

  <h2>บันทึก</h2>
  <pre id="log">กำลังอ่าน…</pre>
  <div class="row" style="margin-top:6px">
    <button id="savelog" class="small">เก็บบันทึกเป็นไฟล์</button>
    <button id="copylog" class="ghost small">คัดลอก</button>
    <button id="clearlog" class="ghost small">ล้าง</button>
  </div>

  <div class="foot">เอาเมาส์ไปวางบนตัวเล่นวิดีโอก็มีปุ่มโหลดโผล่ขึ้นมาเหมือนกัน</div>

  <script src="popup.js"></script>
</body>
</html>
