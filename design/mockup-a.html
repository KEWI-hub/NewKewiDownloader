<!doctype html>
<html lang="en" data-theme="dark" data-accent="prism">
<head>
<meta charset="utf-8">
<title>Prism — Mockup A · Obsidian Glass</title>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="../app/src/design/fonts.css">
<link rel="stylesheet" href="../app/src/design/tokens.css">
<link rel="stylesheet" href="../app/src/design/base.css">
<link rel="stylesheet" href="../app/src/design/components.css">
<script src="assets/icons.js"></script>
<script src="assets/brand.js"></script>
<script src="assets/mock.js"></script>
<style>
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  .win { position: relative; width: 1440px; height: 900px; overflow: hidden; }

  /* ---------- Sidebar (glass over the ambient canvas) ---------- */
  .sidebar {
    position: absolute; left: 8px; top: 8px; bottom: 8px; width: 228px;
    border-radius: 14px;
    display: flex; flex-direction: column;
    z-index: var(--z-sidebar);
  }
  .brand { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 10px 0 14px; }
  .brand__tile {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(160deg, #2a2b3a 0%, #0c0d14 100%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), inset 0 0 0 1px rgb(255 255 255 / .06), 0 2px 6px rgb(0 0 0 / .35);
  }
  .brand__name { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; flex: 1; }
  .brand .tb-btn { width: 28px; height: 28px; border-radius: 7px; }
  .nav { flex: 1; overflow: hidden; padding: 2px 8px 0; }
  .side-section { padding: 14px 10px 5px; display: flex; align-items: center; justify-content: space-between; }
  .side-section .icon { color: var(--text-tertiary); }
  .side-item { height: 30px; }
  .side-item .count { margin-right: -4px; }
  .q-live { color: var(--accent); font-size: var(--text-xs); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .q-time { color: var(--text-tertiary); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }

  .speedcard {
    margin: 8px; padding: 12px 12px 10px; border-radius: 11px;
    background: rgb(0 0 0 / .22); box-shadow: inset 0 0 0 1px var(--border-subtle);
  }
  [data-theme="light"] .speedcard { background: rgb(255 255 255 / .55); box-shadow: inset 0 0 0 1px rgb(16 20 40 / .06), 0 1px 2px rgb(16 20 40 / .05); }
  .speedcard__top { display: flex; align-items: baseline; justify-content: space-between; }
  .speedcard__val { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .speedcard__val small { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0; margin-left: 3px; }
  .speedcard svg.spark { width: 100%; height: 38px; margin: 6px 0 8px; }
  .speedcard__row { display: flex; align-items: center; justify-content: space-between; font-size: var(--text-xs); color: var(--text-tertiary); }
  .speedcard__row b { color: var(--text-secondary); font-weight: 500; }
  .side-foot { display: flex; align-items: center; gap: 2px; padding: 0 8px 8px; }
  .side-foot .tb-btn { width: 30px; height: 30px; }
  .side-foot .user { flex: 1; display: flex; align-items: center; gap: 8px; padding-left: 6px; font-size: var(--text-sm); color: var(--text-secondary); }

  /* ---------- Main sheet (solid) ---------- */
  .sheet {
    position: absolute; left: 244px; top: 8px; right: 8px; bottom: 8px;
    border-radius: 12px; overflow: hidden;
    background: var(--surface-base);
    box-shadow: var(--shadow-sheet);
  }
  .toolbar {
    position: absolute; left: 0; right: 0; top: 0; height: 52px; z-index: var(--z-chrome);
    display: flex; align-items: center; gap: 2px; padding: 0 0 0 10px;
    --_tint: transparent; background-image: none; box-shadow: none;
    border-bottom: 1px solid var(--divider);
  }
  .toolbar .btn--primary { margin-right: 8px; padding: 0 12px 0 10px; }
  .toolbar .spacer { flex: 1; }
  .search { width: 248px; margin-right: 6px; }
  .search .kbd { margin-left: auto; }
  .caption { height: 52px; margin-left: 6px; }
  .caption__btn { width: 44px; }

  .titlerow { position: absolute; left: 0; right: 0; top: 52px; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 20px; }
  .titlerow h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.022em; }
  .titlerow .sub { color: var(--text-tertiary); font-size: var(--text-sm); margin-top: 2px; }
  .titlerow .spacer { flex: 1; }

  /* ---------- Table ---------- */
  .table { position: absolute; left: 0; right: 0; top: 112px; bottom: 0; }
  .cols { display: grid; grid-template-columns: 36px minmax(0, 1fr) 84px 236px 92px 80px 100px 40px; align-items: center; column-gap: 0; }
  .thead { height: 32px; padding: 0 12px; font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); letter-spacing: .01em; border-bottom: 1px solid var(--divider); }
  .thead > div { display: flex; align-items: center; gap: 4px; padding: 0 8px; }
  .thead .num { justify-content: flex-end; }
  .thead .sorted { color: var(--text-secondary); }
  .rows { padding: 4px 8px 0; }
  .row { height: var(--row-h); padding: 0 4px; border-radius: var(--radius-row); position: relative; }
  .row > div { padding: 0 8px; min-width: 0; }
  .row:hover, .row.is-hover { background: var(--state-hover); }
  .row.is-selected { background: var(--state-selected); box-shadow: inset 0 0 0 1px rgb(var(--accent-rgb) / .22); }
  .row + .row::before { content: ""; position: absolute; left: 48px; right: 12px; top: 0; height: 1px; background: var(--divider); }
  .row.is-selected::before, .row.is-selected + .row::before, .row.is-hover::before, .row.is-hover + .row::before { display: none; }
  .namecell { display: flex; align-items: center; gap: 12px; }
  .lead { width: 44px; height: 28px; display: grid; place-items: center; flex: none; }
  .lead .thumb { width: 44px; height: 28px; }
  .name { display: grid; gap: 2px; min-width: 0; }
  .name__t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name__m { font-size: 11.5px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .name__m .sep { opacity: .5; }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .muted { color: var(--text-tertiary); }
  .prog { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .prog__top { display: flex; justify-content: space-between; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text-tertiary); white-space: nowrap; }
  .prog__top b { font-weight: 600; color: var(--text-primary); }
  .prog__top { gap: 10px; }
  .prog__top .st { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
  .prog__top .st > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog__top > span:last-child { flex: none; }
  .added { font-size: 12px; white-space: nowrap; }
  .row.is-hover .added, .row.is-hover .more { visibility: hidden; }
  .st.accent { color: var(--accent); } .st.warning { color: var(--warning); } .st.danger { color: var(--danger); }
  .st.success { color: var(--text-tertiary); } .st.success .icon { color: var(--success); } .st.info { color: var(--info); } .st.neutral { color: var(--text-tertiary); }
  .chk { display: grid; place-items: center; }
  .chk .checkbox { opacity: 0; }
  .row.is-selected .chk .checkbox, .row.is-hover .chk .checkbox { opacity: 1; }
  .row-actions { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-raised); box-shadow: var(--shadow-2), inset 0 0 0 1px var(--border-subtle); }
  .row.is-hover .row-actions { display: flex; }
  .row-actions .tb-btn { width: 28px; height: 28px; border-radius: 7px; }
  .more { color: var(--text-tertiary); display: grid; place-items: center; }

  /* ---------- Status bar (glass over the scrolling list) ---------- */
  .statusbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: var(--z-chrome);
    display: flex; align-items: center; gap: 16px; padding: 0 14px;
    font-size: var(--text-xs); color: var(--text-tertiary);
    border-radius: 0;
  }
  .statusbar .seg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .statusbar b { color: var(--text-secondary); font-weight: 500; font-variant-numeric: tabular-nums; }
  .statusbar .down b { color: var(--accent); }
  .statusbar .spacer { flex: 1; }
  .statusbar .ok { color: var(--success); }
  /* ---------- Compact density: one-line rows, inline progress ---------- */
  [data-density="compact"] .name__m { display: none; }
  [data-density="compact"] .lead { width: 28px; height: 20px; }
  [data-density="compact"] .lead .thumb { width: 28px; height: 18px; border-radius: 4px; }
  [data-density="compact"] .lead .thumb__dur { display: none; }
  [data-density="compact"] .file-tile { width: 20px; height: 20px; border-radius: 6px; }
  [data-density="compact"] .file-tile svg { width: 13px; height: 13px; }
  [data-density="compact"] .prog { grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 10px; }
  [data-density="compact"] .prog .progress { order: 1; }
  [data-density="compact"] .prog__top { order: 2; }
  [data-density="compact"] .prog__top > span:last-child { display: none; }
  [data-density="compact"] .row .num, [data-density="compact"] .prog__top { font-family: var(--font-mono); font-size: 11.5px; }
  [data-density="compact"] .prog__top .st > span { font-family: var(--font-sans); font-size: 12px; }
  [data-density="compact"] .row + .row::before { left: 12px; }
  [data-density="compact"] .namecell { gap: 10px; }
</style>
</head>
<body>
<div class="win canvas">
  <aside class="sidebar glass">
    <div class="brand drag-region">
      <span class="brand__tile" id="brandTile"></span>
      <span class="brand__name">Prism</span>
      <button class="tb-btn" title="Collapse sidebar" id="sbBtn"></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="speedcard" id="speedcard"></div>
    <div class="side-foot" id="sidefoot"></div>
  </aside>

  <main class="sheet">
    <header class="toolbar drag-region" id="toolbar"></header>
    <div class="titlerow" id="titlerow"></div>
    <section class="table">
      <div class="thead cols" id="thead"></div>
      <div class="rows" id="rows"></div>
    </section>
    <footer class="statusbar glass blur-md edge-top" id="statusbar"></footer>
  </main>
</div>

<script>
  var M = window.MOCK, T = M.totals();
  document.getElementById("brandTile").innerHTML = logoMark(22);
  document.getElementById("sbBtn").innerHTML = icon("sidebar", 16);

  // ---- sidebar
  function item(ic, label, count, cur, extra) {
    return '<div class="side-item"' + (cur ? ' aria-current="true"' : "") + ">" + icon(ic, 16) + '<span class="side-item__label">' + label + "</span>" + (extra || (count != null ? '<span class="count">' + count + "</span>" : "")) + "</div>";
  }
  document.getElementById("nav").innerHTML =
    item("all", "All downloads", 28, true) + item("unfinished", "Unfinished", 13) + item("finished", "Finished", 15) +
    '<div class="side-section"><span class="t-overline">Categories</span>' + icon("plus", 14) + "</div>" +
    item("video", "Video", 9) + item("music", "Music", 2) + item("documents", "Documents", 2) + item("programs", "Programs", 7) +
    item("compressed", "Compressed", 6) + item("images", "Images", 0) + item("other", "Other", 3) +
    '<div class="side-section"><span class="t-overline">Queues</span>' + icon("plus", 14) + "</div>" +
    item("queue", "Main queue", null, false, '<span class="q-live"><span class="status-dot status-dot--live"></span>4</span>') +
    item("status-scheduled", "Night queue", null, false, '<span class="q-time">01:00</span>') +
    '<div class="side-section"><span class="t-overline">Grabber</span></div>' +
    item("grabber-project", "Photo archive crawl", 214) + item("trash", "Trash", 3);

  var sp = M.series(40, 11, 60, 14), path = M.sparkPath(sp, 196, 38, 2);
  document.getElementById("speedcard").innerHTML =
    '<div class="speedcard__top"><span class="t-overline">Total speed</span><span class="badge badge--accent">4 active</span></div>' +
    '<div class="speedcard__val" style="margin-top:6px">65.3<small>MB/s</small></div>' +
    '<svg class="spark" viewBox="0 0 196 38" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="' + path.area + '" fill="url(#sg)"/><path d="' + path.line + '" stroke="var(--accent)" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"/></svg>' +
    '<div class="speedcard__row"><span>' + icon("speed-limiter", 13) + ' Limit <b>Off</b></span><span>Peak <b>84.1 MB/s</b></span></div>';
  document.getElementById("sidefoot").innerHTML =
    '<div class="user">' + icon("browser", 15) + 'Edge · <span class="text-success">Connected</span></div>' +
    '<button class="tb-btn">' + icon("moon", 16) + '</button><button class="tb-btn">' + icon("settings", 16) + "</button>";

  // ---- toolbar
  function tb(ic, title, dis) { return '<button class="tb-btn" title="' + title + '"' + (dis ? " disabled" : "") + ">" + icon(ic, 18) + "</button>"; }
  document.getElementById("toolbar").innerHTML =
    '<button class="btn btn--primary no-drag">' + icon("plus", 16, "", 2) + "Add URL</button>" +
    tb("resume", "Resume") + tb("pause", "Pause") + tb("stop", "Stop") + tb("stop-all", "Stop all") +
    '<span class="tb-sep"></span>' + tb("delete", "Delete") + tb("delete-completed", "Delete completed") +
    '<span class="tb-sep"></span>' + tb("start-queue", "Start queue") + tb("stop-queue", "Stop queue") + tb("scheduler", "Scheduler") +
    '<span class="tb-sep"></span>' + tb("grabber", "Site grabber") + tb("batch", "Batch download") + tb("speed-limiter", "Speed limiter") +
    '<span class="spacer"></span>' +
    '<label class="input search no-drag">' + icon("search", 15) + '<input placeholder="Search downloads"><span class="kbd">Ctrl K</span></label>' +
    tb("options", "Options") +
    '<div class="caption no-drag"><button class="caption__btn">' + icon("minimize", 16, "", 1.25) + '</button><button class="caption__btn">' + icon("maximize", 14, "", 1.5) + '</button><button class="caption__btn caption__btn--close">' + icon("close", 16, "", 1.4) + "</button></div>";

  document.getElementById("titlerow").innerHTML =
    '<div><h1>All downloads</h1><div class="sub">28 items · 4 downloading · 61.8 GB total</div></div><span class="spacer"></span>' +
    '<div class="segmented" role="tablist">' +
    '<span class="segmented__item" aria-selected="true">All <span class="segmented__count">28</span></span>' +
    '<span class="segmented__item">Active <span class="segmented__count">6</span></span>' +
    '<span class="segmented__item">Queued <span class="segmented__count">4</span></span>' +
    '<span class="segmented__item">Completed <span class="segmented__count">15</span></span>' +
    '<span class="segmented__item">Failed <span class="segmented__count">1</span></span></div>' +
    '<button class="btn btn--icon" title="Filter">' + icon("filter", 16) + '</button><button class="btn btn--icon" title="Columns">' + icon("columns", 16) + "</button>";

  document.getElementById("thead").innerHTML =
    '<div></div><div class="sorted">Name</div><div class="num">Size</div><div>Progress</div><div class="num">Speed</div><div class="num">Time left</div><div class="num sorted">Added ' + icon("chevron-down", 12, "", 2.2) + "</div><div></div>";

  var html = "";
  M.items.slice(0, document.documentElement.dataset.density === "compact" ? 28 : 17).forEach(function (it, i) {
    var st = M.STATUS[it.status], k = M.KIND[it.kind];
    var cls = "row cols" + (it.selected ? " is-selected" : "") + (i === 1 ? " is-hover" : "");
    var meta = '<span>' + it.host + '</span><span class="sep">·</span><span>' + (it.res ? it.res : k.cat) + "</span>";
    var right = it.status === "downloading" ? M.size(it.size * it.done) + " / " + M.size(it.size) :
      it.status === "paused" || it.status === "waiting" ? M.size(it.size * it.done) + " / " + M.size(it.size) :
      it.status === "completed" ? M.size(it.size) : "";
    var label = it.status === "downloading" ? "<b>" + M.pct(it) + "</b>" : '<span class="st ' + st.cls + '">' + icon(st.icon, 12, "", 2) + '<span>' + M.statusText(it) + "</span></span>";
    html += '<div class="' + cls + '">' +
      '<div class="chk"><span class="checkbox"' + (it.selected ? ' aria-checked="true">' + icon("check", 12, "", 2.5) : ">") + "</span></div>" +
      '<div class="namecell"><span class="lead">' + M.fileTile(it) + '</span>' + '<div class="name"><div class="name__t">' + it.name + '</div><div class="name__m">' + meta + "</div></div></div>" +
      '<div class="num">' + M.size(it.size) + "</div>" +
      '<div class="prog"><div class="prog__top">' + label + "<span>" + right + "</span></div>" + M.progress(it) + "</div>" +
      '<div class="num">' + (M.speed(it.speed) || '<span class="muted">—</span>') + "</div>" +
      '<div class="num">' + (M.eta(it) || '<span class="muted">—</span>') + "</div>" +
      '<div class="num muted added">' + it.added + "</div>" +
      '<div class="more">' + icon("more", 16) + "</div>" +
      (i === 1 ? '<div class="row-actions">' + tb("pause", "Pause") + tb("folder-open", "Show in folder") + tb("link", "Copy link") + "</div>" : "") +
      "</div>";
  });
  document.getElementById("rows").innerHTML = html;

  document.getElementById("statusbar").innerHTML =
    '<span class="seg down">' + icon("arrow-down", 12, "", 2.2) + "<b>65.3 MB/s</b></span>" +
    '<span class="seg">' + icon("arrow-up", 12, "", 2.2) + "<b>0 B/s</b></span>" +
    '<span class="seg">Main queue · <b>4 running, 3 waiting</b></span>' +
    '<span class="seg">' + icon("status-scheduled", 12, "", 2) + "Night queue at <b>01:00</b></span>" +
    '<span class="spacer"></span>' +
    '<span class="seg">' + icon("speed-limiter", 12, "", 2) + "Limit <b>Off</b></span>" +
    '<span class="seg">' + icon("hard-drive", 12, "", 2) + "D:\\Downloads <b>412 GB free</b></span>" +
    '<span class="seg ok">' + icon("shield", 12, "", 2) + "Integration OK</span>";
</script>
</body>
</html>
