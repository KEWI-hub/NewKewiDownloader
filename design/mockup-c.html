<!doctype html>
<html lang="en" data-theme="dark" data-accent="cyan" data-density="compact">
<head>
<meta charset="utf-8">
<title>Prism — Mockup C · Studio</title>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="../app/src/design/fonts.css">
<link rel="stylesheet" href="../app/src/design/tokens.css">
<link rel="stylesheet" href="../app/src/design/base.css">
<link rel="stylesheet" href="../app/src/design/components.css">
<script src="assets/icons.js"></script>
<script src="assets/brand.js"></script>
<script src="assets/mock.js"></script>
<style>
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-size: 12.5px; }
  .win { position: relative; width: 1440px; height: 900px; display: grid; grid-template-rows: 36px 42px 1fr 248px 24px; grid-template-columns: 208px 1fr; background: var(--surface-base); }
  [data-theme="dark"] .win { --surface-base: #0b0c10; --surface-raised: #111217; }
  .titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding-left: 12px; background: var(--surface-raised); border-bottom: 1px solid var(--divider); }
  .titlebar .menu-bar { display: flex; gap: 0; margin-left: 10px; }
  .titlebar .menu-bar span { padding: 4px 9px; border-radius: 6px; color: var(--text-secondary); font-size: 12.5px; }
  .titlebar .menu-bar span:first-child { background: var(--state-hover); color: var(--text-primary); }
  .titlebar .ttl { flex: 1; text-align: center; color: var(--text-tertiary); font-size: 12px; }
  .titlebar .caption { height: 36px; }
  .titlebar .caption__btn { width: 44px; }

  .toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--divider); background: var(--surface-raised); }
  .tb-btn--labeled { height: 30px; border-radius: 7px; color: var(--text-secondary); font-size: 12.5px; padding: 0 9px 0 7px; }
  .tb-btn--labeled .icon { color: var(--text-secondary); }
  .tb-btn--labeled.primary { color: var(--accent); } .tb-btn--labeled.primary .icon { color: var(--accent); }
  .toolbar .spacer { flex: 1; }
  .limit { height: 28px; padding: 0 10px; gap: 6px; font-size: 12px; margin-right: 6px; }
  .search { width: 240px; height: 28px; }

  .sidebar { background: var(--surface-raised); border-right: 1px solid var(--divider); padding: 8px 6px; overflow: hidden; grid-row: 3 / 5; }
  .tree-h { display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px; margin-top: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }
  .tree-h:first-child { margin-top: 0; }
  .side-item { height: 26px; font-size: 12.5px; font-weight: 450; border-radius: 6px; gap: 8px; padding: 0 6px 0 8px; }
  .side-item.indent { padding-left: 24px; }
  .side-item .count { font-family: var(--font-mono); font-size: 10.5px; height: 16px; }
  .side-item[aria-current="true"] { background: var(--accent-soft); box-shadow: none; }

  /* table */
  .main { position: relative; overflow: hidden; }
  .cols { display: grid; grid-template-columns: 28px minmax(0, 1fr) 72px 72px 118px 80px 66px 40px 52px 64px 96px; align-items: center; }
  .thead { height: 28px; padding: 0 8px; border-bottom: 1px solid var(--divider); background: var(--surface-raised); font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
  .thead > div { padding: 0 6px; white-space: nowrap; border-left: 1px solid var(--divider); height: 14px; display: flex; align-items: center; }
  .thead > div:nth-child(-n+2) { border-left: 0; }
  .thead .num { justify-content: flex-end; }
  .thead .sorted { color: var(--text-primary); gap: 3px; }
  .row { height: var(--row-h); padding: 0 8px; font-size: 12.5px; }
  .row:nth-child(even) { background: rgb(255 255 255 / .018); }
  [data-theme="light"] .row:nth-child(even) { background: rgb(16 20 40 / .022); }
  .row > div { padding: 0 6px; min-width: 0; white-space: nowrap; }
  .row.is-selected { background: var(--accent-soft) !important; box-shadow: inset 2px 0 0 var(--accent); }
  .row.is-ctx { background: var(--state-pressed) !important; box-shadow: inset 0 0 0 1px var(--accent-border); }
  .nm { display: flex; align-items: center; gap: 8px; }
  .nm .icon { color: var(--tint); }
  .nm span { overflow: hidden; text-overflow: ellipsis; }
  .mono { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: -0.01em; }
  .num { text-align: right; color: var(--text-secondary); }
  .muted { color: var(--text-disabled); }
  .pcell { display: flex; align-items: center; gap: 8px; }
  .pcell .progress { flex: 1; --_h: 6px; border-radius: 2px; }
  .pcell .progress__fill { border-radius: 2px; }
  .pcell .mono { width: 40px; text-align: right; }
  .stc { display: flex; align-items: center; gap: 6px; }
  .stc.accent { color: var(--accent); } .stc.warning { color: var(--warning); } .stc.danger { color: var(--danger); } .stc.success { color: var(--success); } .stc.info { color: var(--info); } .stc.neutral { color: var(--text-tertiary); }

  /* context menu — the one glass surface in this direction */
  .ctx { position: absolute; left: 360px; top: 214px; width: 248px; z-index: var(--z-dropdown); }

  /* bottom details dock */
  .dock { border-top: 1px solid var(--divider); background: var(--surface-raised); display: grid; grid-template-rows: 34px 1fr; overflow: hidden; }
  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--divider); }
  .tab { height: 34px; display: flex; align-items: center; padding: 0 10px; color: var(--text-tertiary); font-weight: 500; font-size: 12px; position: relative; gap: 6px; }
  .tab.on { color: var(--text-primary); }
  .tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
  .tabs .spacer { flex: 1; }
  .tabs .file { align-self: center; color: var(--text-secondary); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .dock__body { display: grid; grid-template-columns: 1fr 420px; overflow: hidden; }
  .conns { padding: 10px 14px; overflow: hidden; border-right: 1px solid var(--divider); }
  .conn { display: grid; grid-template-columns: 26px 1fr 64px 76px 74px; align-items: center; gap: 10px; height: 20px; font-size: 11.5px; }
  .conn .id { color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11px; }
  .conn .lane { position: relative; height: 8px; border-radius: 2px; background: var(--track-bg); overflow: hidden; }
  .conn .lane i { position: absolute; top: 0; bottom: 0; background: var(--c); border-radius: 2px; opacity: .95; }
  .conn .lane b { position: absolute; top: -1px; bottom: -1px; width: 2px; background: #fff; box-shadow: 0 0 6px var(--c); }
  .conn .num { font-family: var(--font-mono); font-size: 11px; }
  .graphwrap { padding: 10px 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; }
  .graphwrap .h { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-tertiary); }
  .graphwrap .h b { color: var(--text-primary); font-weight: 600; font-family: var(--font-mono); }
  .graphwrap svg { width: 100%; height: 100%; }
  .mapline { display: flex; gap: 14px; font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
  .mapline b { color: var(--text-secondary); font-weight: 500; font-family: var(--font-mono); }

  .statusbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 10px; font-size: 11px; color: var(--text-tertiary); border-top: 1px solid var(--divider); background: var(--surface-raised); }
  .statusbar b { color: var(--text-secondary); font-weight: 500; font-family: var(--font-mono); font-size: 10.5px; }
  .statusbar .s { display: inline-flex; gap: 5px; align-items: center; }
  .statusbar .spacer { flex: 1; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar drag-region" id="titlebar"></div>
  <div class="toolbar" id="toolbar"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="thead cols" id="thead"></div>
    <div id="rows"></div>
    <div class="menu glass-strong blur-sm ctx" id="ctx"></div>
  </main>
  <section class="dock" id="dock"></section>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<script>
  var M = window.MOCK, light = document.documentElement.dataset.theme === "light";
  document.getElementById("titlebar").innerHTML = logoMark(18, light) + '<b style="font-weight:600;margin-left:6px">Prism</b>' +
    '<div class="menu-bar"><span>Downloads</span><span>Queues</span><span>View</span><span>Tools</span><span>Help</span></div><div class="ttl">5 active · 65.3 MB/s</div>' +
    '<div class="caption"><button class="caption__btn">' + icon("minimize", 16, "", 1.25) + '</button><button class="caption__btn">' + icon("maximize", 14, "", 1.5) + '</button><button class="caption__btn caption__btn--close">' + icon("close", 16, "", 1.4) + "</button></div>";
  function lb(ic, t, cls) { return '<button class="tb-btn tb-btn--labeled ' + (cls || "") + '">' + icon(ic, 16) + t + "</button>"; }
  document.getElementById("toolbar").innerHTML =
    lb("add-url", "Add URL", "primary") + lb("resume", "Resume") + lb("pause", "Pause") + lb("stop", "Stop") + lb("stop-all", "Stop all") + '<span class="tb-sep"></span>' +
    lb("delete", "Delete") + lb("delete-completed", "Clear done") + '<span class="tb-sep"></span>' +
    lb("start-queue", "Start queue") + lb("stop-queue", "Stop queue") + lb("scheduler", "Scheduler") + '<span class="tb-sep"></span>' + lb("grabber", "Grabber") +
    '<span class="spacer"></span><button class="btn limit">' + icon("speed-limiter", 14) + 'Limit: Off' + icon("chevron-down", 12) + '</button><label class="input search">' + icon("search", 14) + '<input placeholder="Filter  (name, host, ext:iso)"></label>';

  function si(ic, l, n, cur, ind) { return '<div class="side-item' + (ind ? " indent" : "") + '"' + (cur ? ' aria-current="true"' : "") + ">" + icon(ic, 15) + '<span class="side-item__label">' + l + '</span><span class="count">' + (n == null ? "" : n) + "</span></div>"; }
  document.getElementById("sidebar").innerHTML =
    '<div class="tree-h">' + icon("chevron-down", 11, "", 2.2) + "Downloads</div>" +
    si("all", "All", 28, true) + si("video", "Video", 9, false, 1) + si("music", "Music", 2, false, 1) + si("documents", "Documents", 2, false, 1) + si("programs", "Programs", 7, false, 1) + si("compressed", "Compressed", 6, false, 1) + si("images", "Images", 0, false, 1) + si("other", "Other", 3, false, 1) +
    si("unfinished", "Unfinished", 13) + si("finished", "Finished", 15) +
    '<div class="tree-h">' + icon("chevron-down", 11, "", 2.2) + "Queues</div>" + si("queue", "Main queue", 7) + si("status-scheduled", "Night queue", 1) + si("queue", "Synchronization", 0) +
    '<div class="tree-h">' + icon("chevron-down", 11, "", 2.2) + "Grabber</div>" + si("grabber-project", "Photo archive crawl", 214) + si("grabber-project", "Course materials", 38) + si("trash", "Trash", 3);

  document.getElementById("thead").innerHTML = '<div></div><div class="sorted">Name</div><div class="num">Size</div><div class="num">Done</div><div>Progress</div><div class="num">Speed</div><div class="num">ETA</div><div class="num">Conn</div><div>Resume</div><div>Queue</div><div class="sorted">Added ' + icon("chevron-down", 11, "", 2.2) + "</div>";
  var rows = "";
  M.items.forEach(function (it, i) {
    var st = M.STATUS[it.status], k = M.KIND[it.kind];
    var cls = "row cols" + (it.selected ? " is-selected" : "") + (i === 6 ? " is-ctx" : "");
    rows += '<div class="' + cls + '"><div class="stc ' + st.cls + '">' + icon(st.icon, 14, "", 2) + "</div>" +
      '<div class="nm" style="--tint:var(' + k.tint + ')">' + icon(k.icon, 15) + "<span>" + it.name + "</span></div>" +
      '<div class="num mono">' + M.size(it.size) + "</div>" +
      '<div class="num mono">' + (it.done ? M.size(it.size * it.done) : '<span class="muted">0</span>') + "</div>" +
      '<div class="pcell">' + M.progress(it) + '<span class="mono num">' + (it.status === "queued" || it.status === "scheduled" ? "—" : M.pct(it)) + "</span></div>" +
      '<div class="num mono">' + (M.speed(it.speed) || '<span class="muted">—</span>') + "</div>" +
      '<div class="num mono">' + (M.eta(it) || '<span class="muted">—</span>') + "</div>" +
      '<div class="num mono">' + (it.conns ? it.conns : '<span class="muted">—</span>') + "</div>" +
      "<div>" + (it.status === "error" ? '<span class="text-danger">No</span>' : '<span class="text-tertiary">Yes</span>') + "</div>" +
      '<div class="text-tertiary">' + (it.queue || "—") + "</div>" +
      '<div class="text-tertiary mono" style="font-size:11px">' + it.added.replace("Today ", "") + "</div></div>";
  });
  document.getElementById("rows").innerHTML = rows;

  function mi(ic, t, k, cls) { return '<div class="menu__item ' + (cls || "") + '">' + icon(ic, 15) + "<span>" + t + "</span>" + (k ? '<span class="kbd-hint">' + k + "</span>" : "") + "</div>"; }
  document.getElementById("ctx").innerHTML = mi("open-file", "Open", "Enter") + mi("folder-open", "Show in folder", "Ctrl E") + '<div class="menu__sep"></div>' +
    mi("resume", "Resume", "", "is-hover") + mi("refresh-url", "Refresh download address…") + mi("speed-limiter", "Speed limit…") + mi("queue", "Move to queue") + '<div class="menu__sep"></div>' +
    mi("copy", "Copy link", "Ctrl C") + mi("checksum", "Verify checksum…") + mi("properties", "Properties", "Alt Enter") + '<div class="menu__sep"></div>' + mi("delete", "Delete", "Del", "menu__item--danger");

  var sel = M.items[2];
  var conns = "", n = 12, s = 3;
  for (var i = 0; i < n; i++) {
    s = (s * 9301 + 49297) % 233280; var r = s / 233280;
    var a = i / n, b = (i + 1) / n, f = Math.min(1, 0.35 + r * 0.6), done = i < 3;
    if (done) f = 1;
    var c = "var(--spectrum-" + ((i % 8) + 1) + ")";
    conns += '<div class="conn"><span class="id">#' + String(i + 1).padStart(2, "0") + '</span><span class="lane"><i style="left:' + (a * 100) + "%;width:" + ((b - a) * f * 100) + "%;--c:" + c + '"></i>' + (done ? "" : '<b style="left:calc(' + ((a + (b - a) * f) * 100) + '% - 1px);--c:' + c + '"></b>') + "</span>" +
      '<span class="num">' + (done ? '<span class="text-success">done</span>' : (1 + r * 1.4).toFixed(2) + " MB/s") + '</span><span class="num">' + (a * 5.83).toFixed(2) + "–" + (b * 5.83).toFixed(2) + ' G</span><span class="num text-tertiary">' + (done ? "keep-alive" : "206 · h1") + "</span></div>";
  }
  var sp = M.series(90, 21, 18.4, 5), g = M.sparkPath(sp, 392, 150, 4);
  document.getElementById("dock").innerHTML =
    '<div class="tabs"><span class="tab">Overview</span><span class="tab on">Connections</span><span class="tab">Speed</span><span class="tab">Log</span><span class="tab">Headers</span><span class="spacer"></span><span class="file">' + icon("disk-image", 14) + sel.name + ' <span class="badge badge--accent">12 conn</span></span></div>' +
    '<div class="dock__body"><div class="conns">' + conns + "</div>" +
    '<div class="graphwrap"><div class="h"><span>Throughput · 90 s</span><span><b>18.4 MB/s</b> now · avg <b>17.9</b></span></div>' +
    '<svg viewBox="0 0 392 150" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="M0 37.5H392M0 75H392M0 112.5H392" stroke="var(--divider)"/><path d="' + g.area + '" fill="url(#cg)"/><path d="' + g.line + '" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>' +
    '<div class="mapline"><span>Downloaded <b>3.64 GB</b></span><span>Remaining <b>2.19 GB</b></span><span>ETA <b>2m 02s</b></span></div></div></div>';

  document.getElementById("statusbar").innerHTML = '<span class="s">' + icon("arrow-down", 11, "", 2.2) + "<b>65.3 MB/s</b></span><span class=\"s\">" + icon("arrow-up", 11, "", 2.2) + "<b>0 B/s</b></span><span>Active <b>4</b> · Queued <b>4</b> · Failed <b>1</b></span><span class=\"spacer\"></span><span>Clipboard monitor <b>on</b></span><span>D: <b>412 GB</b> free</span><span class=\"s text-success\">" + icon("status-completed", 11, "", 2.2) + "Edge integration</span>";
</script>
</body>
</html>
