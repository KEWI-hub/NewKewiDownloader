name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag ที่จะออก release เช่น v0.8.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            '${{ github.event.inputs.tag }}'
          }
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "tag=$tag version=$version"

      # กฎของโปรเจกต์: เลขใน csproj ต้องตรงกับ tag เสมอ
      # ปล่อยให้เพี้ยนแล้วจะได้ exe ที่หัวหน้าต่างบอกเวอร์ชันผิด ซึ่งไล่ปัญหายากมาก
      - name: Check the version in csproj matches the tag
        shell: pwsh
        run: |
          $csproj = Get-Content src/NewKewi.App/NewKewi.App.csproj -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') {
            throw 'หา <Version> ใน csproj ไม่เจอ'
          }
          $inFile = $Matches[1]
          $wanted = '${{ steps.version.outputs.version }}'
          if ($inFile -ne $wanted) {
            throw "เวอร์ชันไม่ตรงกัน: csproj เป็น $inFile แต่ tag เป็น $wanted"
          }
          Write-Host "เวอร์ชันตรงกัน: $inFile"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish the app
        shell: pwsh
        run: |
          dotnet publish src/NewKewi.App/NewKewi.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            --output publish
          Get-ChildItem publish/NewKewiDownloader.exe | Select-Object Name, Length

      # เครื่องมือภายนอกไม่ได้อยู่ใน repo (ใหญ่เกินไป) โหลดจากต้นทางทางการตอน build
      - name: Fetch yt-dlp, ffmpeg and aria2c
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pack/NewKewiDownloader/bin | Out-Null
          $bin = 'pack/NewKewiDownloader/bin'

          Invoke-WebRequest `
            -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' `
            -OutFile "$bin/yt-dlp.exe"

          Invoke-WebRequest `
            -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' `
            -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          Get-ChildItem ffmpeg-extract -Recurse -Include ffmpeg.exe, ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName $bin }

          Invoke-WebRequest `
            -Uri 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip' `
            -OutFile aria2.zip
          Expand-Archive aria2.zip -DestinationPath aria2-extract
          Get-ChildItem aria2-extract -Recurse -Filter aria2c.exe |
            Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName $bin }

          Get-ChildItem $bin | Select-Object Name, Length

      - name: Assemble the portable folder
        shell: pwsh
        run: |
          $root = 'pack/NewKewiDownloader'
          Copy-Item publish/NewKewiDownloader.exe $root
          Copy-Item README.md $root
          Copy-Item -Recurse modules   $root
          Copy-Item -Recurse extension $root
          New-Item -ItemType Directory -Force "$root/assets" | Out-Null
          Copy-Item assets/app.ico "$root/assets"

          $startHere = @"
          New Kewi Video Downloader ${{ steps.version.outputs.tag }}
          ===============================================

          วิธีใช้
          -------
          1. ดับเบิลคลิก NewKewiDownloader.exe ได้เลย ไม่ต้องติดตั้ง
          2. กด "เพิ่มลิงก์" แล้ววางลิงก์วิดีโอ

          ส่วนขยายเบราว์เซอร์ (ปุ่มโหลดลอยเหนือวิดีโอ)
          ---------------------------------------------
          เปิด chrome://extensions -> เปิด Developer mode -> Load unpacked
          -> เลือกโฟลเดอร์ extension ในนี้
          กดโหลดครั้งแรกแอปจะถามว่าอนุญาตให้เชื่อมต่อไหม ให้กดอนุญาตครั้งเดียวจบ

          เว็บที่กันบอท (Cloudflare)
          --------------------------
          กดปุ่ม "ผ่านด่านเว็บ" บนแถบเครื่องมือ แล้วกดยืนยันในหน้าต่างที่เปิดขึ้นมาเอง
          ครั้งแรกแอปจะโหลด Chromium พกพามาให้ ประมาณ 150 MB ครั้งเดียวจบ

          โฟลเดอร์ที่แอปสร้างเอง
          ----------------------
          data/        ตั้งค่า คิว cookie ของแอปเอง
          logs/        บันทึกเวลาแอปมีปัญหา
          _chromium/   Chromium พกพา
          _profile/    profile ของเบราว์เซอร์แอป (ไม่เกี่ยวกับเบราว์เซอร์ที่คุณใช้อยู่)

          แอปไม่เคยอ่าน cookie ของเบราว์เซอร์ที่คุณใช้อยู่ มันใช้ของตัวเองเท่านั้น
          "@
          $startHere | Out-File "$root/START-HERE.txt" -Encoding utf8

          Get-ChildItem $root

      - name: Make the zip
        shell: pwsh
        run: |
          $name = "NewKewiDownloader-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path pack/NewKewiDownloader -DestinationPath $name
          Get-Item $name | Select-Object Name, Length
          "zip=$name" | Out-File $env:GITHUB_OUTPUT -Append
        id: zip

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## New Kewi Video Downloader ${{ steps.version.outputs.tag }}

          Release แรกของแอปที่เขียนใหม่ทั้งหมด (C# / .NET 10 / WPF)

          ### มีอะไรบ้าง

          - หน้าตาแบบ IDM: คิว, หน้าต่างรายละเอียดงาน, ไอคอนถาดระบบ
          - config ต่อเว็บเป็น Lua ซิงก์จาก repo เอง เพิ่มเว็บใหม่ได้โดยไม่ต้องออก release
          - โหลดหลายลิงก์พร้อมกัน และหลายช่องต่อลิงก์
          - ได้ .mp4 เสมอ (ไม่มีการแปลงเป็น H.265)
          - ไม่มี retry อัตโนมัติ งานที่ล้มเหลวค้างไว้พร้อมเหตุผล
          - Chromium พกพาสำหรับเว็บที่ต้องรัน JS หรือกันบอท
          - ส่วนขยายเบราว์เซอร์: ปุ่มโหลดลอยเหนือตัวเล่นวิดีโอ เลือกความชัดได้
          - ไม่แตะ cookie ของเบราว์เซอร์ที่คุณใช้อยู่เลย

          ### ไฟล์

          | ไฟล์ | ใช้เมื่อไหร่ |
          |---|---|
          | ``NewKewiDownloader-${{ steps.version.outputs.tag }}-win-x64.zip`` | **เอาอันนี้** ชุดเต็มพร้อมใช้ มี yt-dlp / ffmpeg / aria2c และส่วนขยายมาให้แล้ว |
          | ``NewKewiDownloader.exe`` | เฉพาะตัวแอป สำหรับคนที่มีเครื่องมือใน ``bin\`` อยู่แล้ว |

          ไม่ต้องติดตั้ง .NET แยก ตัว exe รวมมาให้แล้ว

          ### ข้อจำกัดที่รู้อยู่

          - คลิปที่มี DRM โหลดไม่ได้ ไม่ว่าทางไหน
          - เว็บที่กัน Cloudflare ต้องกดผ่านด่านเองหนึ่งครั้ง (ปุ่ม "ผ่านด่านเว็บ")
          - หน้าต่างรายละเอียดไม่มีแถบแยกต่อช่องแบบ IDM เพราะ yt-dlp รายงานความคืบหน้ารวมเท่านั้น
          "@
          $notes | Out-File notes.md -Encoding utf8

          gh release create ${{ steps.version.outputs.tag }} `
            "${{ steps.zip.outputs.zip }}" `
            "publish/NewKewiDownloader.exe" `
            --title "New Kewi Video Downloader ${{ steps.version.outputs.tag }}" `
            --notes-file notes.md
