<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 340px; margin: 0; padding: 12px;
    font: 13px/1.45 "Segoe UI", "Leelawadee UI", system-ui, sans-serif;
    color: #1b1f24; background: #f7f8fa;
  }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; }
  h1 img { width: 22px; height: 22px; border-radius: 50%; }

  .state { padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; }
  .state.ok   { background: #e6f6ec; color: #0b6a33; }
  .state.warn { background: #fff4e0; color: #7a4b00; }
  .state.bad  { background: #fdecec; color: #a1231f; }

  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 6px;
    padding: 6px 12px; background: #2997ff; color: #fff;
  }
  button:hover { background: #1b86ea; }
  button.ghost { background: #fff; color: #1b1f24; border: 1px solid #e2e5ea; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-top: 1px solid #e2e5ea;
  }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .tag { font-size: 11px; color: #6b7480; }
  .empty { color: #6b7480; font-size: 12px; padding: 8px 0; }
  .foot { margin-top: 10px; font-size: 11px; color: #6b7480; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> New Kewi Downloader</h1>

  <div id="state" class="state warn">กำลังตรวจสอบแอป…</div>
  <div id="actions"></div>

  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>ยังไม่เจอวิดีโอในแท็บนี้ — ลองกดเล่นวิดีโอก่อน แล้วเปิดเมนูนี้ใหม่</div>

  <div class="foot">เอาเมาส์ไปวางบนตัวเล่นวิดีโอก็มีปุ่มโหลดโผล่ขึ้นมาเหมือนกัน</div>

  <script src="popup.js"></script>
</body>
</html>
