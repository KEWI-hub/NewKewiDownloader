[package]
name = "prism-testserver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Configurable local HTTP/1.1 (and minimal FTP) test server for the Prism download engine (throttling, faults, auth, redirects, HLS/DASH fixtures)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "prism-testserver"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
http-body = "1"
base64 = "0.22"
fastrand = "2.5"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
